[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "churn-retention-platform"
version = "1.0.0"
description = "Reproducible synthetic customer churn prediction and retention experimentation platform"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=2.0", "scikit-learn>=1.3", "streamlit>=1.30", "plotly>=5.18"]

[project.optional-dependencies]
test = ["pytest>=8.0,<9"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"
